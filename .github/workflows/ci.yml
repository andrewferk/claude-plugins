name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test every plugin that has a test script
        run: |
          for pkg in plugins/*/package.json; do
            dir=$(dirname "$pkg")
            if node -e "process.exit(require('./$pkg').scripts?.test ? 0 : 1)"; then
              echo "== $dir"
              (cd "$dir" && npm test)
            fi
          done
      - name: The repository passes its own comment scanner
        uses: ./plugins/comment-guard
        with:
          scope: all
          paths: |
            plugins/*/hooks/*.js
            plugins/*/test/*.js
      - name: The pull request adds no comment that breaks the policy
        if: github.event_name == 'pull_request'
        uses: ./plugins/comment-guard
      - name: Validate the marketplace and every plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
